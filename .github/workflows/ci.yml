name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build & test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app 2>/dev/null || true
          swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Bundle
        run: scripts/build-app.sh release
